[project]
name = "mospolytech-mcp"
version = "0.1.0"
description = "MCP-сервер для работы с данными Московского Политехнического университета"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "requests>=2.28",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mospolytech_mcp.open_api._vendor" = ["hash_salt.txt", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
