[project]
name = "mospolytech-mcp"
version = "1.0.1"
description = "MCP-сервер для работы с данными Московского Политехнического университета"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "requests>=2.28",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "mcp>=2.2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[project.scripts]
mospolytech-mcp = "mospolytech_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mospolytech_mcp.open_api._vendor" = ["hash_salt.txt", "*.md"]

[tool.ruff]
target-version = "py314"
line-length = 120
# сторонний код (лицензия в NOTICE.md) не проверяем
extend-exclude = ["src/mospolytech_mcp/open_api/_vendor"]

[tool.bandit]
exclude_dirs = ["tests", "src/mospolytech_mcp/open_api/_vendor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
