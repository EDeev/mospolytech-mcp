services:
  db:
    image: postgres:17-alpine
    container_name: mospolytech-db
    hostname: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mospolytech_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-mospolytech_mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mospolytech_mcp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Одноразовый сервис: применяет миграции Alembic и завершается, сервер стартует после него
  migrate:
    build: .
    image: mospolytech-mcp
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mospolytech_mcp}:${POSTGRES_PASSWORD:-mospolytech_mcp}@db:5432/${POSTGRES_DB:-mospolytech_mcp}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build: .
    image: mospolytech-mcp
    container_name: mospolytech-mcp
    hostname: mcp
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mospolytech_mcp}:${POSTGRES_PASSWORD:-mospolytech_mcp}@db:5432/${POSTGRES_DB:-mospolytech_mcp}
      MCP_SECRET_KEY: ${MCP_SECRET_KEY:?MCP_SECRET_KEY не задан — python -m mospolytech_mcp.crypto}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
