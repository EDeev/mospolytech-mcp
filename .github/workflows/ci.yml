name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ghcr.io/edeev/mospolytech-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker push (dev, prod only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'prod' || 'dev' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  deploy-stage:
    needs: publish
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, test]
    env:
      STAGE: edsnrv327@192.168.235.129
      SSH_OPTS: -i /home/edsnrv327/.ssh/stage_deploy -o StrictHostKeyChecking=accept-new
    steps:
      - uses: actions/checkout@v7

      - name: Copy compose file to stage
        run: scp $SSH_OPTS deploy/docker-compose.yaml $STAGE:mospolytech-deploy/docker-compose.yaml

      - name: Deploy image to stage
        run: ssh $SSH_OPTS $STAGE 'cd mospolytech-deploy && docker compose pull && docker compose up -d'

      - name: Check that the server responds
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://192.168.235.129:8000/mcp || true)
            if [ "$code" != "000" ]; then echo "stage is up, HTTP $code"; exit 0; fi
            sleep 3
          done
          echo "stage did not respond" && exit 1
