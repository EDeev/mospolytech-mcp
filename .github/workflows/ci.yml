name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ghcr.io/edeev/mospolytech-mcp

jobs:
  # Статический анализ: сборка не начнётся, пока все четыре проверки не пройдут
  quality:
    name: quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - name: Full report (does not fail the build)
        run: ruff check --exit-zero --output-format=full . | tee ruff-report.txt
      - name: Blocker rules E9, F63, F7, F82 (any finding fails the build)
        run: ruff check --select E9,F63,F7,F82 --output-format=full .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruff-report
          path: ruff-report.txt

  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "bandit[toml]==1.9.4"
      - name: Full report (does not fail the build)
        run: bandit -r src -c pyproject.toml -f html -o bandit-report.html --exit-zero
      - name: HIGH severity and confidence fail the build
        run: bandit -r src -c pyproject.toml --severity-level high --confidence-level high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.html

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      - name: Scan history of the current branch (any secret fails the build)
        run: ./gitleaks git --redact --log-opts="HEAD" --report-format json --report-path gitleaks-report.json .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # SQL миграций: Alembic выводит их офлайн (без подключения к БД), squawk ищет опасные для живой БД операции
  sql:
    name: sql-security (squawk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e . squawk-cli==2.71.0
      - name: Render migrations to SQL (offline mode, no database connection)
        env:
          DATABASE_URL: postgresql+psycopg://offline:offline@localhost:5432/offline
        run: alembic upgrade head --sql > migrations.sql
      - name: Lint migrations SQL (any finding fails the build, rules in .squawk.toml)
        run: squawk migrations.sql
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migrations-sql
          path: migrations.sql

  build:
    needs: [quality, security, secrets, sql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Юнит- и интеграционные тесты для всех веток: между сборкой и доставкой
  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mospolytech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mospolytech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/mospolytech_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: pytest -v --cov=mospolytech_mcp --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker push (dev, prod only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'prod' || 'dev' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  # Развёртывание на stage со сверкой схем БД: образцом служит схема TEST-стенда (ВМ test, ~/test-stand)
  deploy-stage:
    needs: publish
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, test]
    env:
      STAGE: edsnrv327@192.168.235.129
      SSH_OPTS: -i /home/edsnrv327/.ssh/stage_deploy -o StrictHostKeyChecking=accept-new
      TEST_STAND: /home/edsnrv327/test-stand
    steps:
      - uses: actions/checkout@v7

      - name: Update compose files on TEST and STAGE
        run: |
          cp deploy/docker-compose.yaml $TEST_STAND/docker-compose.yaml
          scp $SSH_OPTS deploy/docker-compose.yaml $STAGE:mospolytech-deploy/docker-compose.yaml

      - name: Apply migrations to TEST database
        run: cd $TEST_STAND && docker compose pull -q && docker compose run --rm migrate && docker compose up -d

      - name: Dump TEST schema
        run: cd $TEST_STAND && sh $GITHUB_WORKSPACE/scripts/dump_schema.sh > $RUNNER_TEMP/schema-test.sql

      - name: Dump STAGE schema before deployment
        run: ssh $SSH_OPTS $STAGE 'cd mospolytech-deploy && sh -s' < scripts/dump_schema.sh > $RUNNER_TEMP/schema-stage-before.sql

      - name: Compare TEST and STAGE schemas (before)
        run: |
          if diff -u $RUNNER_TEMP/schema-stage-before.sql $RUNNER_TEMP/schema-test.sql; then
            echo "TEST and STAGE schemas are already identical"
          else
            echo "Schemas differ, STAGE will be brought to the TEST schema"
          fi

      - name: Apply migrations to STAGE database
        run: ssh $SSH_OPTS $STAGE 'cd mospolytech-deploy && docker compose pull -q && docker compose run --rm migrate'

      - name: Deploy image to stage
        run: ssh $SSH_OPTS $STAGE 'cd mospolytech-deploy && docker compose up -d'

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if body=$(curl -fsS --max-time 5 http://192.168.235.129:8000/health); then
              echo "stage is healthy: $body"; exit 0
            fi
            sleep 3
          done
          echo "stage /health did not succeed within 60 s" && exit 1

      - name: Dump STAGE schema after deployment
        run: ssh $SSH_OPTS $STAGE 'cd mospolytech-deploy && sh -s' < scripts/dump_schema.sh > $RUNNER_TEMP/schema-stage-after.sql

      - name: Verify that TEST and STAGE schemas are identical
        run: diff -u $RUNNER_TEMP/schema-test.sql $RUNNER_TEMP/schema-stage-after.sql && echo "TEST and STAGE schemas are identical"
