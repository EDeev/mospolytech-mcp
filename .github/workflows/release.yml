name: Release

# Релиз по тегу v* (ставится на main после деплоя на prod): пакет в GitHub Releases, образ с тегом версии
on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/edeev/mospolytech-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Version from tag must match pyproject.toml
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "тег $GITHUB_REF_NAME, а в pyproject.toml $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## \[/ { on = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "в CHANGELOG.md нет раздела ${{ steps.version.outputs.version }}"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker push (version, latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
